[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-anchor"
version = "1.0.0"
description = "Document AI that can say 'I don't know': verbatim anchoring, abstention, frozen-holdout evaluation, blind-window backtest, contract lint"
readme = "README.md"
license = "LicenseRef-PolyForm-Small-Business-1.0.0"
license-files = ["LICENSE.md", "NOTICE", "COMMERCIAL.md"]
authors = [{ name = "Gioacchino Tortorici" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "document-ai", "extraction", "grounding", "abstention", "legal", "italian", "contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Italian",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
backtest = ["numpy>=1.24", "pandas>=2.0"]
timestral = ["numpy>=1.24", "pandas>=2.0", "timestral", "torch"]
dev = ["pytest>=8", "numpy>=1.24", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/Giotor84/zt-anchor"
Commercial = "https://github.com/Giotor84/zt-anchor/blob/main/COMMERCIAL.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
