# Pubblica la pagina offline per i revisori su GitHub Pages (https://<utente>.github.io/zt-anchor/).
# Prima volta: Settings > Pages > Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", "src/zt_anchor/contract_lint.py", "src/zt_anchor/it_normalize.py"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python web/build.py
      - run: mkdir -p site && cp web/dist/zt-anchor-lint.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
